# ==============================================================================
# LEGALMETRY — Redis Broker & Persistence Configuration (Person 1 - Infra)
# ==============================================================================

# Network bindings
bind 0.0.0.0
protected-mode no
port 6379

# Memory & eviction policy for high-volume scan queues
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (Append Only File enabled to safeguard Jan Vishwas countdowns)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Snapshot saves
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice