# LEGALMETRY Redis Configuration
# Celery Broker + Dashboard Aggregation Cache

bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence: AOF enabled for durability of Celery notice tasks
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice