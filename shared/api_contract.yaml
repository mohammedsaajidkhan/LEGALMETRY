openapi: 3.0.3
info:
  title: Legal Metrology Compliance Scanner API
  version: 0.1.0-hackathon
  description: >
    Locked contract for the 7-hour build. Only ONE endpoint is defined here on
    purpose (POST /scan). Do not extend this file after Pre-Flight without
    getting agreement from all 5 people first — see the "locked" rule in
    shared/api_contract.yaml ownership.

paths:
  /scan:
    post:
      summary: Analyze a packaged-commodity photo for Legal Metrology compliance
      operationId: createScan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: Scan processed (see status field for partial/error cases)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'

components:
  schemas:

    ScanRequest:
      type: object
      required: [image, category]
      properties:
        image:
          type: string
          format: binary
          description: JPEG/PNG photo of the product with reference coin visible.
        coin_metadata:
          $ref: '#/components/schemas/CoinMetadata'
        category:
          type: string
          description: >
            Product category used by the Category-Aware Verification Router
            (e.g. "packaged_food", "cosmetics", "stationery"). Hardcoded
            lookup covers 5-6 categories for the 80% target.
          example: packaged_food

    CoinMetadata:
      type: object
      description: >
        Known-size reference used for pixel-to-mm calibration. MVP note:
        document says "inspector ID card" as the long-term reference design;
        this build's 80% target uses a coin instead — keep field names
        generic enough that swapping the physical reference later doesn't
        break the contract.
      properties:
        reference_type:
          type: string
          enum: [coin]
          default: coin
        known_diameter_mm:
          type: number
          format: float
          description: Real-world diameter of the reference coin in mm.
          example: 27.0

    ScanResponse:
      type: object
      required: [status, severity]
      properties:
        status:
          type: string
          description: >
            Always populated. Non-"ok" values mean the pipeline degraded
            gracefully instead of crashing — the response must still be
            valid JSON in every case.
          enum:
            - ok
            - no_coin_detected
            - ocr_failed
            - no_declarations_found
            - low_confidence
          example: ok

        extracted_fields:
          type: object
          description: Rule 6 mandatory declarations pulled from OCR text.
          properties:
            mrp:
              type: string
              nullable: true
              example: "₹120"
            net_quantity:
              type: string
              nullable: true
              example: "500 g"
            manufacturer_name:
              type: string
              nullable: true
              example: "ABC Foods Pvt Ltd"
            manufacturer_address:
              type: string
              nullable: true
            mfg_date:
              type: string
              nullable: true
              example: "07/2026"
            consumer_care:
              type: string
              nullable: true

        measurements:
          type: object
          description: Physical font-size measurement derived from coin calibration.
          properties:
            mm_per_pixel:
              type: number
              format: float
              nullable: true
            font_height_mm:
              type: number
              format: float
              nullable: true
            table_i_minimum_mm:
              type: number
              format: float
              nullable: true
              description: Applicable Table I minimum this measurement is checked against.

        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'

        severity:
          type: string
          enum: [None, Minor, Moderate, Critical]
          description: Overall severity for this scan (highest across violations).

        manufacturer:
          type: object
          nullable: true
          description: Entity-resolution + MHI result, if a match was found.
          properties:
            manufacturer_id:
              type: string
              nullable: true
            match_type:
              type: string
              enum: [exact, none]
            mhi_score:
              type: number
              format: float
              nullable: true
              description: Simplified (non-weighted-decay) manufacturer history index.

        evidence:
          type: object
          nullable: true
          description: Only populated when severity is not "None" (two-tier report design).
          properties:
            photo_url:
              type: string
              nullable: true
            sha256_hash:
              type: string
              nullable: true

    Violation:
      type: object
      required: [field, rule_reference, severity]
      properties:
        field:
          type: string
          example: font_height
        rule_reference:
          type: string
          example: "Table I - Font Minimums"
        description:
          type: string
          example: "Measured font height 0.9mm is below the 1.5mm minimum for this net quantity band."
        severity:
          type: string
          enum: [Minor, Moderate, Critical]
